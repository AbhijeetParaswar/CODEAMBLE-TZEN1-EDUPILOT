# ─────────────────────────────────────────────────────────────────────────────
# EduPilot nginx config — Cloudflare proxy mode
#
# Cloudflare terminates SSL. EC2 only sees HTTP from Cloudflare's IPs.
# DO NOT add an SSL block here — Cloudflare handles the cert.
#
# Cloudflare DNS settings required:
#   Type: CNAME
#   Name: api
#   Target: <your-ec2-public-ip>   (or EC2 public DNS)
#   Proxy: ENABLED (orange cloud) ← critical for free SSL
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 512;
}

http {
    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/edupilot_access.log;
    error_log  /var/log/nginx/edupilot_error.log;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream fastapi {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name api.devedupilot.xyz;

        # ── Proxy to FastAPI ──────────────────────────────────────────────────
        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $http_cf_connecting_ip;   # real visitor IP from Cloudflare
            proxy_set_header   X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

            # LLM inference can be slow — give it 120s
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # SSE / streaming support for chat endpoint
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── Health check endpoint (no rate limit) ─────────────────────────────
        location /health {
            proxy_pass http://fastapi/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
